<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fechamento — Calçados</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#211d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fechamento">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper: #f2ede2;
  --paper-2: #e9e1d0;
  --ink: #211d18;
  --ink-soft: #5c5346;
  --line: #d8cdb6;
  --card: #fffdf8;

  --c-basq: #33459c;
  --c-basq-soft: #e4e7f7;
  --c-bota: #7a4a26;
  --c-bota-soft: #f0e2d2;
  --c-plat: #9c7300;
  --c-plat-soft: #f7edcf;
  --total-bg: #ece3fa;
  --total-text: #5a3d99;

  --danger: #b3402f;
  --fechamento: #d9720c;
}

body.dark-mode {
  --paper: #121212;
  --paper-2: #1e1e1e;
  --ink: #f0f0f0;
  --ink-soft: #a0a0a0;
  --line: #333333;
  --card: #181818;

  --c-basq: #889cf5;
  --c-basq-soft: #1a2240;
  --c-bota: #d99a6c;
  --c-bota-soft: #382212;
  --c-plat: #ffcc33;
  --c-plat-soft: #4d3a00;
  --total-bg: #322a47;
  --total-text: #cbb6f5;
  --fechamento: #ffa733;
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
body{
  background: var(--paper);
  background-image: linear-gradient(var(--paper-2) 1px, transparent 1px);
  background-size: 100% 34px;
  color: var(--ink);
  font-family:'Space Grotesk', system-ui, sans-serif;
  font-size: 16px;
  min-height:100vh;
  padding-bottom: 96px;
  transition: background-color 0.3s, color 0.3s;
}
::selection{ background: var(--c-basq); color:#fff;}

header{
  background: var(--paper);
  border-bottom: 2px solid var(--ink);
  padding: 16px 18px 12px;
}
.title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.brand{ display:flex; align-items:center; gap:10px; min-width:0;}
.brand-text{ min-width:0; flex:1;}
.brand-icon{ width:48px; height:48px; border-radius:11px; flex-shrink:0; object-fit:cover;}
@media(max-width:380px){ .brand-icon{ width:40px; height:40px; border-radius:9px; } }
.stamp{
  font-family:'Bebas Neue', sans-serif;
  border: 2.5px solid var(--ink);
  border-radius: 4px;
  padding: 3px 9px 1px;
  font-size: 15px;
  letter-spacing: 1px;
  transform: rotate(-3deg);
  line-height:1;
}
h1{ font-size: 21px; margin:0; font-weight:700; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.h-sub{ font-size:13px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.count-pill{
  font-family:'JetBrains Mono', monospace;
  font-size:13.5px; font-weight:600;
  background: var(--ink); color: var(--paper);
  border-radius: 20px; padding: 6px 13px;
  white-space:nowrap; flex-shrink:0;
}
@media(max-width:380px){
  .count-pill{ font-size:11.5px; padding:5px 10px; }
  h1{ font-size:18px; }
}
.searchbar{ margin-top:12px; position:relative;}
.searchbar input{
  width:100%; background: var(--card); border:1.5px solid var(--line);
  border-radius: 10px; padding: 12px 14px 12px 38px;
  font-family:'JetBrains Mono', monospace; font-size:16px; color:var(--ink);
  outline:none;
}
.searchbar input:focus{ border-color: var(--ink);}
.searchbar svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45;}

nav.tabs{
  position: fixed; left:0; right:0; bottom:0; z-index:30;
  background: var(--card);
  border-top: 2px solid var(--ink);
  display:flex;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  gap:4px;
}
nav.tabs button{
  flex:1; display:flex; align-items:center; justify-content:center;
  background:transparent; border:none; padding:12px 4px; border-radius:10px;
  font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600;
  color: var(--ink-soft); cursor:pointer;
}
nav.tabs button.active{ background: var(--total-bg); color: var(--total-text); font-weight:700;}

main{ padding: 16px 10px 20px; max-width: 1100px; margin: 0 auto; overflow-x:hidden;}
.grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; transition: opacity .16s ease, transform .16s ease;}
.grid.swiping{ opacity:0; }
.grid.swiping.from-right{ transform: translateX(18px); }
.grid.swiping.from-left{ transform: translateX(-18px); }
@media(min-width:640px){ .grid{grid-template-columns: repeat(4,1fr); gap:12px;} }
@media(min-width:900px){ .grid{grid-template-columns: repeat(5,1fr); gap:12px;} }
.card{ grid-column: span 1;}

.card{
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  position:relative;
  display:flex; flex-direction:column;
  transition: transform .1s, border-color .2s;
}
.card.fechamento{ border: 2px solid var(--fechamento); box-shadow: 0 0 8px rgba(217, 114, 12, 0.3); }
.card:active{ transform: scale(.98);}
.photo{
  aspect-ratio: 1/1; width:100%;
  background: var(--paper-2);
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
.photo img{ width:100%; height:100%; object-fit:cover;}
.photo .ph-icon{ opacity:.28;}
.cat-tag{
  position:absolute; top:8px; left:8px;
  font-family:'Bebas Neue', sans-serif; font-size:11px; letter-spacing:.5px;
  border-radius:4px; padding:2px 7px 1px; border:1.5px solid currentColor;
  background: var(--card); z-index: 2;
}
.cat-tag.basquete{ color: var(--c-basq);}
.cat-tag.bota{ color: var(--c-bota);}
.cat-tag.plataforma{ color: var(--c-plat);}
.fechamento-badge {
  position:absolute; top:8px; right:8px; font-size: 16px; z-index: 2; display: none;
}
.card.fechamento .fechamento-badge { display: block; text-shadow: 0 0 4px rgba(0,0,0,0.5); }

.card-body{ padding:10px 11px 11px; display:flex; flex-direction:column; gap:3px; flex:1;}
.codigo{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:16px; letter-spacing:-.2px;}
.cor{ font-size:13.5px; color: var(--ink-soft); line-height:1.3; min-height:17px;}
.total-chip{
  font-family:'JetBrains Mono', monospace; font-size:12.5px; font-weight:700;
  color: var(--total-text); background: var(--total-bg); border-radius:20px; padding:4px 10px;
  white-space:nowrap; flex-shrink:0;
}
.sizes-head{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; margin-bottom:5px; gap:6px; flex-wrap:wrap;}
.sizes-head span:first-child{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sizes-head span{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-soft); font-weight:600;}
.size-list{ display:flex; flex-wrap:wrap; gap:6px; flex:1;}
.size-chip{
  display:flex; align-items:center; gap:6px;
  font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600;
  background: var(--paper-2); border-radius:7px; padding:5px 5px 5px 10px;
  cursor:pointer; color: var(--ink);
}
.size-chip:hover{ background: var(--line);}
.size-chip-label{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.25; white-space: nowrap; min-width:52px;}
.size-chip-qtd{ font-size:11.5px; font-weight:500; color: var(--ink-soft);}
.size-chip .x{
  width:18px; height:18px; border-radius:50%; background: var(--card);
  display:flex; align-items:center; justify-content:center; font-size:12px; color: var(--danger);
  line-height:1;
}
.size-chip .x:hover{ background: var(--danger); color:#fff;}
.size-chip .check{
  width:18px; height:18px; border-radius:50%; background: var(--card);
  display:flex; align-items:center; justify-content:center; font-size:11px; color: var(--ink-soft);
  line-height:1; border:1.5px solid var(--line);
}
.size-chip .check:hover{ border-color: var(--ink); color: var(--ink); }
.size-chip.done{ opacity:.6; }
.size-chip.done .check{ background: #2f9e44; border-color:#2f9e44; color:#fff; }
.size-chip.done > span:first-of-type, .size-chip.done{ text-decoration: line-through; text-decoration-color: var(--ink-soft); }
.add-size-chip{
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700;
  background: transparent; border: 1.5px dashed var(--line); border-radius:7px;
  padding:5px 11px; cursor:pointer; color: var(--ink-soft);
}
.add-size-chip:hover{ border-color: var(--ink); color: var(--ink);}
.card-actions{ display:flex; border-top:1.5px solid var(--line); }
.card-actions button{
  flex:1; background:transparent; border:none; padding:10px 4px;
  font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:600;
  color: var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px;
}
.card-actions button.fechar-btn { color: var(--ink-soft); font-size: 14px;}
.card.fechamento .card-actions button.fechar-btn { color: var(--fechamento); }
.card-actions button:not(:last-child){ border-right:1.5px solid var(--line);}
.card-actions button.del{ color: var(--danger);}
.card-actions button:hover{ background: var(--paper-2);}

.empty{ grid-column: 1/-1; text-align:center; padding: 60px 20px; color: var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:14.5px; }

.ph-icon{ font-size:38px; }

@media(max-width:640px){
  .card{ border-radius:12px; }
  .card-body{ padding:8px 8px 9px; gap:3px; }
  .codigo{ font-size:13.5px; line-height:1.2; word-break:break-all; }
  .cor{ font-size:11px; min-height:0; line-height:1.25; }
  .total-chip{ font-size:10.5px; padding:3px 7px; }
  .sizes-head{ margin-top:6px; margin-bottom:4px; }
  .sizes-head span{ font-size:9.5px; }
  .size-list{ gap:4px; }
  .size-chip{ font-size:12px; padding:4px 4px 4px 7px; gap:4px; border-radius:6px; }
  .size-chip-label{ min-width:40px; }
  .size-chip .x{ width:15px; height:15px; font-size:10px; }
  .add-size-chip{ font-size:13px; padding:4px 8px; border-radius:6px; }
  .cat-tag{ font-size:9.5px; padding:1.5px 6px 0; top:6px; left:6px; }
  .fechamento-badge{ font-size:13px; top:6px; right:6px; }
  .ph-icon{ font-size:30px; }
  .card-actions button{ padding:9px 3px; font-size:14px; }
  .card-actions .btn-label{ display:none; }
}

.fab{
  position: fixed; right:18px; bottom: 84px; z-index:25;
  width:56px; height:56px; border-radius:50%;
  background: var(--ink); color: var(--paper);
  border:none; font-size:28px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 8px 20px rgba(0,0,0,.35);
  cursor:pointer;
}
.fab:active{ transform: scale(.94);}

.overlay{
  position:fixed; top:0; left:0; right:0; height:100vh; background: rgba(0,0,0,.65);
  display:none; align-items:flex-end; justify-content:center; z-index:50;
}
.overlay.show{ display:flex;}
.sheet{
  background: var(--paper); width:100%; max-width: 480px;
  border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height: 82vh; overflow-y:auto;
  animation: slideup .22s ease;
}
@keyframes slideup{ from{ transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.sheet-handle{ width:38px; height:4px; background: var(--line); border-radius:4px; margin: 0 auto 14px;}
.sheet h2{ margin:0 0 14px; font-size:19px;}
.field{ margin-bottom:14px;}
.field label{ display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input[type=text], .field input[type=number], .field select{
  width:100%; background: var(--card); border:1.5px solid var(--line); border-radius:9px;
  padding: 12px 13px; font-family:'Space Grotesk',sans-serif; font-size:16px; color: var(--ink); outline:none;
}
.field input:focus, .field select:focus{ border-color: var(--ink);}
.field-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink); font-weight: 600; font-size: 15px;}
.field-checkbox input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--fechamento);}
.cat-choice{ display:flex; gap:8px;}
.catalog-wrap{ position:relative; }
.catalog-wrap input{
  width:100%; background: var(--card); border:1.5px solid var(--line); border-radius:9px;
  padding: 12px 13px; font-family:'Space Grotesk',sans-serif; font-size:16px; color: var(--ink); outline:none;
}
.catalog-wrap input:focus{ border-color: var(--ink);}
.catalog-results{
  position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5;
  background: var(--card); border:1.5px solid var(--line); border-radius:10px;
  max-height:240px; overflow-y:auto; display:none; box-shadow:0 8px 18px rgba(0,0,0,.18);
}
.catalog-results.show{ display:block; }
.catalog-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; cursor:pointer;
  border-bottom:1px solid var(--line);
}
.catalog-item:last-child{ border-bottom:none; }
.catalog-item:hover, .catalog-item:active{ background: var(--paper-2); }
.catalog-item .thumb{
  width:38px; height:38px; border-radius:7px; background: var(--paper-2); flex:0 0 38px;
  display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:18px;
}
.catalog-item .thumb img{ width:100%; height:100%; object-fit:cover; }
.catalog-item .info{ min-width:0; flex:1; }
.catalog-item .info .cod{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.catalog-item .info .c{ font-size:12px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.catalog-empty{ padding:12px 10px; font-size:13px; color: var(--ink-soft); font-family:'JetBrains Mono',monospace;}
.catalog-item.stock-row{ cursor:default; }
.catalog-item.stock-row:hover, .catalog-item.stock-row:active{ background: transparent; }
.stock-row .stock-actions{ display:flex; gap:6px; flex-shrink:0; }
.stock-row .stock-actions .mini-btn{ flex:none; padding:8px 10px; }
.cat-choice button{
  flex:1; padding:11px 6px; border-radius:9px; border:1.5px solid var(--line);
  background: var(--card); font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600;
  color: var(--ink-soft); cursor:pointer;
}
.cat-choice button.sel[data-cat="basquete"]{ background: var(--c-basq-soft); border-color: var(--c-basq); color: var(--c-basq);}
.cat-choice button.sel[data-cat="bota"]{ background: var(--c-bota-soft); border-color: var(--c-bota); color: var(--c-bota);}
.cat-choice button.sel[data-cat="plataforma"]{ background: var(--c-plat-soft); border-color: var(--c-plat); color: var(--c-plat);}
.cat-choice button.sel[data-cat="todos"]{ background: var(--paper-2); border-color: var(--ink); color: var(--ink);}
.cat-choice.compact button{ padding:8px 4px; font-size:12.5px; }
.photo-input{
  border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; text-align:center;
  cursor:pointer; position:relative; background: var(--card);
}
.photo-input img{ max-width:100%; max-height:120px; border-radius:8px; margin-bottom:6px;}
.photo-input span{ display:block; font-size:12px; color: var(--ink-soft);}
.photo-input input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer;}
.field-row{ display:flex; gap:10px;}
.field-row .field{ flex:1;}
.size-row-input{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.size-row-input input{
  flex:1; min-width:0; background: var(--card); border:1.5px solid var(--line); border-radius:9px;
  padding: 11px 12px; font-family:'Space Grotesk',sans-serif; font-size:16px; color: var(--ink); outline:none;
}
.size-row-input input:focus{ border-color: var(--ink); }
.size-row-input .row-remove{
  flex:0 0 34px; width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line);
  background: var(--card); color: var(--danger); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.size-row-input .row-remove:hover{ background: var(--danger); color:#fff; border-color:var(--danger); }
.sheet-actions{ display:flex; gap:10px; margin-top:6px;}
.btn{
  flex:1; border:none; border-radius:10px; padding:14px; font-family:'Space Grotesk',sans-serif;
  font-weight:700; font-size:16px; cursor:pointer;
}
.btn-primary{ background: var(--ink); color: var(--paper);}
.btn-secondary{ background: var(--card); color: var(--ink-soft); border:1.5px solid var(--line);}

.topbar-actions{ display:flex; gap:8px; margin-top:10px;}
.week-bar-wrap{ display:flex; align-items:center; gap:6px; margin-top:10px;}
.week-bar{
  display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1;
  padding-bottom:2px;
}
.week-bar::-webkit-scrollbar{ display:none; }
.week-chip{
  flex-shrink:0; white-space:nowrap;
  font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600;
  background: var(--card); border:1.5px solid var(--line); border-radius:20px;
  padding:7px 13px; cursor:pointer; color: var(--ink-soft);
}
.week-chip.active{ background: var(--ink); border-color: var(--ink); color: var(--paper); }
.week-chip.add{ border-style:dashed; }
.week-manage-btn{
  flex-shrink:0; white-space:nowrap;
  padding:7px 12px; border-radius:20px;
  background: var(--card); border:1.5px solid var(--line); color: var(--ink-soft);
  font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px;
}
.week-manage-btn:hover{ border-color: var(--ink); color: var(--ink); }
.week-tag-body{
  font-size:11.5px; color: var(--ink-soft); font-family:'JetBrains Mono',monospace;
  margin-top:1px;
}
@media(max-width:640px){
  .week-chip{ font-size:11px; padding:6px 10px; }
  .week-manage-btn{ font-size:11px; padding:6px 9px; }
  .week-tag-body{ font-size:10px; }
}
.mini-btn{
  flex:1; font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600;
  background: var(--card); border:1.5px solid var(--line); border-radius:8px; padding:9px 6px; cursor:pointer;
  color: var(--ink-soft);
}
.mini-btn.icon-btn { flex: 0 0 40px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.mini-btn:hover{ border-color: var(--ink); color: var(--ink);}

#toast{
  position:fixed; bottom: 92px; left:50%; transform: translateX(-50%) translateY(20px);
  opacity:0; pointer-events:none;
  background: var(--ink); color: var(--paper); padding: 11px 19px; border-radius: 30px;
  font-family:'JetBrains Mono',monospace; font-size:14px; z-index:15;
  transition: transform .25s ease, opacity .25s ease;
  max-width: 88vw; text-align:center;
  display:flex; align-items:center; justify-content:center; gap:12px;
}
#toast.show{ transform: translateX(-50%) translateY(0); opacity:1; pointer-events:auto;}
.toast-undo-btn{
  background: var(--paper); color: var(--ink); border:none; border-radius:20px;
  padding:6px 14px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;
  cursor:pointer; flex-shrink:0; white-space:nowrap;
}

.photo{ cursor:pointer; }
.photo .zoom-hint{
  position:absolute; bottom:6px; right:6px; z-index:2;
  background: rgba(0,0,0,.5); color:#fff; border-radius:50%;
  width:20px; height:20px; display:flex; align-items:center; justify-content:center;
  font-size:11px; pointer-events:none;
}
@media(max-width:640px){ .photo .zoom-hint{ width:16px; height:16px; font-size:9px; bottom:4px; right:4px;} }

.lightbox{
  position:fixed; inset:0; z-index:60; background: rgba(0,0,0,.92);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.lightbox.show{ display:flex; }
.lightbox img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
.lightbox-close{
  position:fixed; top: calc(14px + env(safe-area-inset-top)); right:14px; z-index:61;
  width:40px; height:40px; border-radius:50%; border:none;

// A lista de semanas fica salva no navegador (localStorage); cada sapato
// guarda a que semana pertence no campo `semana`.
// ============================================================
let WEEKS = [];
try{ WEEKS = JSON.parse(localStorage.getItem('weekFolders') || '[]'); }catch(e){ WEEKS = []; }
let currentWeek = localStorage.getItem('currentWeek') || 'todas';

function persistCurrentWeek(){
  try{ localStorage.setItem('currentWeek', currentWeek); }catch(e){}
}

function saveWeeks(){
  localStorage.setItem('weekFolders', JSON.stringify(WEEKS));
}

// Garante que toda semana já usada em algum sapato apareça na lista de
// pastas, mesmo que tenha vindo de uma importação de JSON.
function syncWeeksFromData(){
  const set = new Set(WEEKS);
  DATA.forEach(d => { if(d.semana) set.add(d.semana); });
  const merged = Array.from(set);
  if(merged.length !== WEEKS.length || merged.some((w,i)=> w!==WEEKS[i])){
    WEEKS = merged;
    saveWeeks();
  }
}

 Claro", "numeracao": 36, "quantidade": 1, "foto": "", "fechamento": false}, {"id": 27, "categoria": "bota", "codigo": "CT34990001", "cor": "Castanha Clara/Ouro Claro", "numeracao": 36, "quantidade": 2, "foto": "", "fechamento": false}, {"id": 28, "categoria": "bota", "codigo": "CT04510001", "cor": "Branco/Vermelho", "numeracao": 35, "quantidade": 1, "foto": "", "fechamento": false}, {"id": 29, "categoria": "bota", "codigo": "CT04510001", "cor": "Branco/Vermelho", "numeracao": 36, "quantidade": 1, "foto": "", "fechamento": false}, {"id": 30, "categoria": "plataforma", "codigo": "CT34900002", "cor": "Branco/Ouro Claro", "numeracao": 36, "quantidade": 3, "foto": "", "fechamento": false}];

}

// ============================================================
// MODO NUVEM (Supabase) — para vários usuários editarem juntos.
// Preencha SUPABASE_URL e SUPABASE_ANON_KEY e troque CLOUD_ENABLED
// para true. Enquanto CLOUD_ENABLED for false, o app funciona
// normalmente salvando só neste aparelho/navegador (modo local).
// ============================================================
const CLOUD_ENABLED = false;
const SUPABASE_URL = 'https://hfoewuyrrsydrcclmcnx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhmb2V3dXlycnN5ZHJjY2xtY254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NjAxNTcsImV4cCI6MjEwMDMzNjE1N30.w5KHGmXt2yUR09rsi0Gdjs7_b610zYg0MFKaXtVYYg8';

let CLOUD_MODE = false;
let supa = null;
if(CLOUD_ENABLED && SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
  CLOUD_MODE = true;
  // Desativa a persistência/auto-refresh de sessão de autenticação: o app
  // não usa login, e esse recurso é o que causa o erro
  // "DataCloneError ... Headers object could not be cloned" em alguns navegadores.

function itemToRow(item){
  return {
    id: item.id,
    categoria: item.categoria,
    codigo: item.codigo,
    cor: item.cor,
    numeracao: item.numeracao,
    quantidade: item.quantidade,
    foto: item.foto || '',
    fechamento: !!item.fechamento,
    ja_fechado: !!item.jaFechado,
    semana: item.semana || ''
  };
}
function rowToItem(row){
  return {
    id: row.id,
    categoria: row.categoria,
    codigo: row.codigo,
    cor: row.cor,
    numeracao: row.numeracao,
    quantidade: row.quantidade,
    foto: row.foto || '',
    fechamento: !!row.fechamento,
    jaFechado: !!row.ja_fechado,
    semana: row.semana || ''
  };
}

if(CLOUD_MODE){
  loadFromDB();
  loadCatalogFromDB();
  // Como vários usuários editam ao mesmo tempo, atualiza periodicamente
  // pra puxar o que outras pessoas mudaram.
  setInterval(()=>{ loadFromDB(); loadCatalogFromDB(); }, 6000);
} else {
  const requestDB = indexedDB.open("CalcadosDB", 5);
  requestDB.onupgradeneeded = function(e) {
    db = e.target.result;
    const tx = e.target.transaction;
    const isNewShoesStore = !db.objectStoreNames.contains('shoes');
    let shoesStore;
    if(isNewShoesStore) {
      shoesStore = db.createObjectStore('shoes', {keyPath: 'id'});
      initialData.forEach(d => shoesStore.add(d));
    } else {
      // Loja já existe: NUNCA apagar os sapatos já cadastrados do usuário aqui.
      shoesStore = tx.objectStore('shoes');
    }

    if(!db.objectStoreNames.contains('catalog')) {
      const catalogStore = db.createObjectStore('catalog', {keyPath: 'id'});
      if(isNewShoesStore){
        // Instalação nova: semeia o estoque a partir dos dados de exemplo.
        const seen = {};
        initialData.forEach(d => {
          const key = catalogKey(d.categoria, d.codigo);
          if(!seen[key]){
            seen[key] = true;
            catalogStore.add({ id:key, categoria:d.categoria, codigo:d.codigo, cor:d.cor||'', foto:d.foto||'' });
          }
        });
      } else {
        // Usuário existente: migra os sapatos que já tem na lista para o novo estoque,
        // assim nada que já foi cadastrado se perde.
        const getAllReq = shoesStore.getAll();
        getAllReq.onsuccess = function(){
          const seen = {};
          getAllReq.result.forEach(d => {
            const key = catalogKey(d.categoria, d.codigo);
            if(!seen[key]){
              seen[key] = true;
              catalogStore.put({ id:key, categoria:d.categoria, codigo:d.codigo, cor:d.cor||'', foto:d.foto||'' });
            }
          });
        };
      }
    }
  };
  requestDB.onsuccess = function(e) {
    db = e.target.result;
    loadFromDB();
    loadCatalogFromDB();
  };
  requestDB.onerror = function(e) {
    toast('Não foi possível acessar o armazenamento do dispositivo. Se estiver em aba anônima/privada, saia dela e tente de novo.');
  };
  requestDB.onblocked = function(e) {
    toast('Feche outras abas com este app abertas e tente novamente.');
  };
}

function loadFromDB() {
  if(CLOUD_MODE){
    supa.from('shoes').select('*').then(({data, error})=>{
      if(error){ toast('Erro ao carregar da nuvem: ' + error.message); return; }
      DATA = (data||[]).map(rowToItem);
      render();
    });
    return;
  }
  const tx = db.transaction('shoes', 'readonly');
  const store = tx.objectStore('shoes');
  const req = store.getAll();
  req.onsuccess = function() {
    DATA = req.result;
    render();
  };
}

function saveToDB(item) {
  if(CLOUD_MODE){
    supa.from('shoes').upsert(itemToRow(item)).then(({error})=>{
      if(error) toast('Erro ao salvar na nuvem: ' + error.message);
    });
    return;
  }
  const tx = db.transaction('shoes', 'readwrite');
  tx.onerror = function(e){
    toast('Erro ao salvar no dispositivo: ' + (e.target.error ? e.target.error.message : 'tente uma foto menor.'));
  };
  tx.objectStore('shoes').put(item);
}

function deleteFromDB(id) {
  if(CLOUD_MODE){
    supa.from('shoes').delete().eq('id', id).then(({error})=>{
      if(error) toast('Erro ao excluir na nuvem: ' + error.message);
    });
    return;
  }
  const tx = db.transaction('shoes', 'readwrite');
  tx.objectStore('shoes').delete(id);
}

function loadCatalogFromDB() {
  if(CLOUD_MODE){
    supa.from('catalog').select('*').then(({data, error})=>{
      if(error){ toast('Erro ao carregar estoque da nuvem: ' + error.message); return; }
      CATALOG = (data||[]).map(r => ({ id:r.id, categoria:r.categoria, codigo:r.codigo, cor:r.cor||'', foto:r.foto||'' }));
    });
    return;
  }
  const tx = db.transaction('catalog', 'readonly');
  const req = tx.objectStore('catalog').getAll();
  req.onsuccess = function() {
    CATALOG = req.result;
  };
}

function saveCatalogEntry(entry) {
  const idx = CATALOG.findIndex(c => c.id === entry.id);
  if(idx >= 0) CATALOG[idx] = entry; else CATALOG.push(entry);
  if(CLOUD_MODE){
    supa.from('catalog').upsert(entry).then(({error})=>{
      if(error) toast('Erro ao salvar estoque na nuvem: ' + error.message);
    });
    return;
  }
  const tx = db.transaction('catalog', 'readwrite');
  tx.onerror = function(e){
    toast('Erro ao salvar no estoque: ' + (e.target.error ? e.target.error.message : 'tente uma foto menor.'));
  };
  tx.objectStore('catalog').put(entry);
}

function deleteCatalogEntry(id) {
  CATALOG = CATALOG.filter(c => c.id !== id);
  if(CLOUD_MODE){
    supa.from('catalog').delete().eq('id', id).then(({error})=>{
      if(error) toast('Erro ao excluir do estoque na nuvem: ' + error.message);
    });
    return;
  }
  const tx = db.transaction('catalog', 'readwrite');
  tx.objectStore('catalog').delete(id);
}

// Toda vez que um sapato é salvo na lista de compras, o cadastro (código,
// cor, categoria, foto) também é guardado no estoque — que não é apagado
// quando o item é removido da lista de compras.
function upsertCatalogFromItem(payload, codigo){
  const key = catalogKey(payload.categoria, codigo);
  const existing = CATALOG.find(c => c.id === key);
  saveCatalogEntry({
    id: key,
    categoria: payload.categoria,
    codigo: codigo,
    cor: payload.cor || (existing ? existing.cor : ''),
    foto: payload.foto || (existing ? existing.foto : '')
  });
}

const CAT_LABEL = { basquete:"Basquete", bota:"Bota", plataforma:"Plataforma", todos:"Todos" };
const CAT_ORDER_INDEX = { basquete:0, bota:1, plataforma:2 };
const main = document.querySelector('main');
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const hSub = document.getElementById('hSub');
const countPill = document.getElementById('countPill');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2000);
}

function hideToast(){
  const t = document.getElementById('toast');
  clearTimeout(t._timer);
  t.classList.remove('show');
}

// Toast com botão "Desfazer" — usado depois de excluir, dando alguns
// segundos pra reverter antes do toast sumir.
function showUndoToast(msg, onUndo){
  const t = document.getElementById('toast');
  clearTimeout(t._timer);
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'toast-undo-btn';
  btn.textContent = 'Desfazer';
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    onUndo();
  });
  t.appendChild(span);
  t.appendChild(btn);
  t.classList.add('show');
  t._timer = setTimeout(()=> t.classList.remove('show'), 5000);
}

// Remove os itens da lista de compras imediatamente (com toast de "Desfazer"),
// mas mantém tudo pronto pra restaurar caso o usuário se arrependa.
function scheduleUndoDelete(items, message){
  DATA = DATA.filter(d => !items.some(it => it.id === d.id));
  items.forEach(item => deleteFromDB(item.id));
  render();
  showUndoToast(message, ()=>{
    items.forEach(item => { DATA.push(item); saveToDB(item); });
    render();
    hideToast();
  });
}

function iconFor(cat){ return {basquete:'🏀', bota:'👢', plataforma:'⬆'}[cat] || '👟'; }

// Escreve a quantidade por extenso: "1 par", "2 pares", "3 pares"...
function parLabel(qtd){
  const n = Number(qtd) || 0;
  return n + (n === 1 ? ' par' : ' pares');
}

function groupItems(list){
  const groups = [];
  const index = {};
  list.forEach(item => {
    const key = groupKey(item);
    if(!(key in index)){
      index[key] = groups.length;
      groups.push({
        key,
        categoria: item.categoria,
        codigo: item.codigo,
        cor: item.cor,
        foto: item.foto,
        fechamento: item.fechamento,
        semana: item.semana || '',
        rows: []
      });
    }
    const g = groups[index[key]];
    g.rows.push(item);
    if(!g.foto && item.foto) g.foto = item.foto;
    if(!g.cor && item.cor) g.cor = item.cor;
    if(item.fechamento) g.fechamento = true; 
  });
  return groups;
}

function render(){
  syncWeeksFromData();

  const term = searchInput.value.toLowerCase().trim();
  let list = DATA.filter(d =>
    (currentCat === 'todos' || d.categoria === currentCat) &&
    (currentWeek === 'todas' || (d.semana||'') === currentWeek)
  );
  if(term){
    list = list.filter(d =>
      (d.codigo||'').toLowerCase().includes(term) ||
      (d.cor||'').toLowerCase().includes(term) ||
      String(d.numeracao||'').includes(term)
    );
  }

  const groups = groupItems(list).sort((a,b) => {
    // Fechamento tem prioridade máxima: vai para o começo da fila
    // independentemente da categoria (basquete, bota ou plataforma).
    if(a.fechamento !== b.fechamento) return a.fechamento ? -1 : 1;
    return (CAT_ORDER_INDEX[a.categoria] ?? 99) - (CAT_ORDER_INDEX[b.categoria] ?? 99);
  });

  grid.innerHTML = '';
  if(groups.length === 0){
    grid.innerHTML = '<div class="empty">Nenhum sapato aqui ainda.<br>Toque no botão + para adicionar.</div>';
  } else {
    const frag = document.createDocumentFragment();
    groups.forEach(g => {
      const totalGroup = g.rows.reduce((s,r)=> s + (Number(r.quantidade)||0), 0);
      const sizeChips = g.rows
        .sort((a,b)=> (Number(a.numeracao)||0) - (Number(b.numeracao)||0))
        .map(r => `
          <span class="size-chip ${r.jaFechado ? 'done' : ''}" data-editid="${r.id}">
            <span class="size-chip-label"><span class="size-chip-num">Nº${r.numeracao ?? '—'}</span><span class="size-chip-qtd">${parLabel(r.quantidade)}</span></span>
            <span class="check" data-checkid="${r.id}" title="${r.jaFechado ? 'Já fechado' : 'Marcar como já fechado'}">${r.jaFechado ? '✓' : ''}</span>
            <span class="x" data-delid="${r.id}">✕</span>
          </span>
        `).join('');

      const el = document.createElement('div');
      el.className = `card ${g.fechamento ? 'fechamento' : ''}`;
      el.innerHTML = `
        <div class="photo">
          <div class="fechamento-badge">⚠️</div>
          <span class="cat-tag ${g.categoria}">${CAT_LABEL[g.categoria]}</span>
          ${g.foto ? `<img src="${g.foto}" alt="${g.codigo}"><span class="zoom-hint">🔍</span>` : `<span class="ph-icon">${iconFor(g.categoria)}</span>`}
        </div>
        <div class="card-body">
          <div class="codigo">${g.codigo||'—'}</div>
          <div class="cor">${g.cor||''}</div>
          ${(currentWeek === 'todas' && g.semana) ? `<div class="week-tag-body">🗂 ${g.semana}</div>` : ''}
          <div class="sizes-head">
            <span>Numerações</span>
            <span class="total-chip">${parLabel(totalGroup)} total</span>
          </div>
          <div class="size-list">
            ${sizeChips}
            <button type="button" class="add-size-chip" data-addcat="${g.categoria}" data-addcodigo="${g.codigo}" data-addcor="${g.cor||''}" data-addfoto="${g.foto||''}" data-addfechamento="${g.fechamento}" data-addsemana="${g.semana||''}">+ nº</button>
          </div>
        </div>
        <div class="card-actions">
          <button class="fechar-btn" data-fechamentocode="${g.key}">⚠️<span class="btn-label"> Fechamento</span></button>
          <button class="edit" data-editcode="${g.key}">✎<span class="btn-label"> Editar</span></button>
          <button class="del" data-delcode="${g.key}">🗑<span class="btn-label"> Excluir</span></button>
        </div>
      `;
      frag.appendChild(el);
    });
    grid.appendChild(frag);
  }

  const totalItens = groups.length;
  const totalPares = list.reduce((s,d)=> s + (Number(d.quantidade)||0), 0);
  countPill.textContent = totalItens + (totalItens===1 ? ' código' : ' códigos') + ' · ' + totalPares + (totalPares===1?' par':' pares');
  hSub.textContent = `${totalPares} par(es) a buscar` + (currentWeek === 'todas' ? ' nesta visão' : ` · ${currentWeek}`);

  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.cat===currentCat));
  renderWeekBar();
}

// ============================================================
// HISTÓRICO DE OVERLAYS — faz o botão "voltar" do celular fechar
// só a janela aberta (formulário, imagem, estoque, semanas) em vez
// de sair do app inteiro. Toda vez que uma janela abre, empurramos
// um estado no histórico do navegador; o listener de 'popstate'
// (disparado pelo botão voltar) é quem realmente esconde a janela.
// Os botões de fechar do próprio app (X, Cancelar, tocar fora) usam
// closeOverlayHistory(), que só chama history.back() — assim os dois
// caminhos (botão físico e botão do app) sempre passam pelo mesmo lugar.
// ============================================================
const OVERLAY_CLOSERS = {
  overlay: hideForm,
  weekOverlay: () => weekOverlay.classList.remove('show'),
  stockOverlay: () => stockOverlay.classList.remove('show'),
  lightbox: () => lightbox.classList.remove('show')
};

let overlayStack = [];

function openOverlayHistory(name){
  overlayStack.push(name);
  history.pushState({ overlay: name }, '');
}

function closeOverlayHistory(name){
  if(overlayStack.length && overlayStack[overlayStack.length - 1] === name){
    history.back();
  } else if(OVERLAY_CLOSERS[name]){
    // segurança: se por algum motivo esse overlay não está no topo do
    // histórico, ao menos esconde ele na tela.
    OVERLAY_CLOSERS[name]();
    overlayStack = overlayStack.filter(n => n !== name);
  }
}

// Troca uma janela por outra sem empilhar um passo extra no histórico
// (ex: fechar o Estoque e já abrir o formulário de cadastro por cima).
function switchOverlay(fromName, openFn){
  if(overlayStack.length && overlayStack[overlayStack.length - 1] === fromName){
    overlayStack.pop();
  }
  if(OVERLAY_CLOSERS[fromName]) OVERLAY_CLOSERS[fromName]();
  openFn();
}

window.addEventListener('popstate', ()=>{
  const name = overlayStack.pop();
  if(name && OVERLAY_CLOSERS[name]) OVERLAY_CLOSERS[name]();
});

document.getElementById('weekManageBtn').addEventListener('click', ()=>{
  renderWeekManageList();
  weekOverlay.classList.add('show');
  openOverlayHistory('weekOverlay');
});
document.getElementById('weekOverlayCloseBtn').addEventListener('click', ()=> closeOverlayHistory('weekOverlay'));
weekOverlay.addEventListener('click', (e)=>{ if(e.target === weekOverlay) closeOverlayHistory('weekOverlay'); });

document.getElementById('weekAddBtn').addEventListener('click', ()=>{

  renderWeekManageList();
  renderWeekBar();
});

weekManageList.addEventListener('click', (e)=>{
  const renameBtn = e.target.closest('[data-renameweek]');
  if(renameBtn){
    const oldName = renameBtn.dataset.renameweek;
    const newName = prompt(`Novo nome para "${oldName}":`, oldName);
    if(!newName) return;
    const trimmed = newName.trim();
    if(!trimmed || trimmed === oldName) return;
    if(WEEKS.includes(trimmed)){
      toast('Já existe uma semana com esse nome.');
      return;
    }
    WEEKS = WEEKS.map(w => w === oldName ? trimmed : w);
    saveWeeks();
    // Isto só atualiza a etiqueta dos sapatos que já eram dessa semana —
    // não move nada de uma semana para outra.
    DATA.filter(d => (d.semana||'') === oldName).forEach(item => {
      item.semana = trimmed;
      saveToDB(item);
    });
    if(currentWeek === oldName){ currentWeek = trimmed; persistCurrentWeek(); }
    renderWeekManageList();
    render();
    toast('Semana renomeada.');
    return;
  }
  const delBtn = e.target.closest('[data-delweek]');
  if(delBtn){
    const name = delBtn.dataset.delweek;
    const count = DATA.filter(d => (d.semana||'') === name).length;
    if(count > 0){
      toast(`Essa semana tem ${count} numeração(ões). Edite ou exclua esses sapatos primeiro.`);
      return;
    }
    if(confirm(`Excluir a semana "${name}"? Ela está vazia.`)){
      WEEKS = WEEKS.filter(w => w !== name);
      saveWeeks();
      if(currentWeek === name){ currentWeek = 'todas'; persistCurrentWeek(); }
      renderWeekManageList();
      render();
      toast('Semana excluída.');
    }
  }
});

const CAT_ORDER = ['todos','basquete','bota','plataforma'];

function setCategory(cat, direction){
  currentCat = cat;
  try{ localStorage.setItem('currentCat', cat); }catch(e){}
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.cat===cat));

  if(direction){
    grid.classList.add('swiping', direction === 'next' ? 'from-right' : 'from-left');
    requestAnimationFrame(()=>{
      render();
      requestAnimationFrame(()=>{
        grid.classList.remove('swiping','from-right','from-left');
      });
    });
  } else {
    render();
  }
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=> setCategory(btn.dataset.cat));
});

searchInput.addEventListener('input', render);

grid.addEventListener('click', (e)=>{
  const photoImg = e.target.closest('.photo img');
  if(photoImg){
    document.getElementById('lightboxImg').src = photoImg.src;
    document.getElementById('lightbox').classList.add('show');
    openOverlayHistory('lightbox');
    return;
  }

  const xBtn = e.target.closest('.x[data-delid]');
  if(xBtn){
    const id = xBtn.dataset.delid;
    const item = DATA.find(d=>d.id===id);
    if(item){
      scheduleUndoDelete([item], `Nº ${item.numeracao ?? '—'} removido de ${item.codigo}.`);
    }
    return;
  }

  const checkBtn = e.target.closest('.check[data-checkid]');
  if(checkBtn){
    const id = checkBtn.dataset.checkid;
    const item = DATA.find(d=>d.id===id);
    if(item){
      item.jaFechado = !item.jaFechado;
      saveToDB(item);
      render();
    }
    return;
  }
  
  const chip = e.target.closest('.size-chip[data-editid]');
  if(chip){ openForm(chip.dataset.editid); return; }

  const addChip = e.target.closest('.add-size-chip');
  if(addChip){
    openForm(null, {
      categoria: addChip.dataset.addcat,
      codigo: addChip.dataset.addcodigo,
      cor: addChip.dataset.addcor,
      foto: addChip.dataset.addfoto,
      fechamento: addChip.dataset.addfechamento === 'true',
      semana: addChip.dataset.addsemana || ''
    });
    return;
  }

  const fechamentoGroupBtn = e.target.closest('button.fechar-btn[data-fechamentocode]');
  if(fechamentoGroupBtn){
    const key = fechamentoGroupBtn.dataset.fechamentocode;
    const groupItems = DATA.filter(d => groupKey(d) === key);
    if(groupItems.length){
      const isFechamentoNow = !groupItems[0].fechamento;
      groupItems.forEach(item => {
        item.fechamento = isFechamentoNow;
        saveToDB(item);
      });
      render();
    }
    return;
  }

  const editGroupBtn = e.target.closest('button.edit[data-editcode]');
  if(editGroupBtn){
    openGroupEditForm(editGroupBtn.dataset.editcode);
    return;
  }

  const delGroupBtn = e.target.closest('button.del[data-delcode]');
  if(delGroupBtn){
    const key = delGroupBtn.dataset.delcode;
    const groupItems = DATA.filter(d => groupKey(d) === key);
    if(groupItems.length){
      scheduleUndoDelete(groupItems, `${groupItems[0].codigo} removido da lista (segue salvo no 📦 Estoque).`);
    }
  }
});

// Abre o formulário pra editar TODAS as numerações de um card de uma vez

  hideToast();
  editingId = null;
  editingGroupKey = key;

  document.getElementById('singleSizeField').style.display = 'none';

  editingId = id || null;
  editingGroupKey = null;
  photoDataUrl = "";
  document.getElementById('photoPreview').style.display='none';
  document.getElementById('photoText').textContent = 'Toque para escolher uma foto';

  document.getElementById('catalogSearch').value = '';

  document.getElementById('catalogField').style.display = (id || prefill) ? 'none' : '';
  document.getElementById('addToStockField').style.display = (id || prefill) ? 'none' : '';
  document.getElementById('singleSizeField').style.display = id ? '' : 'none';
  document.getElementById('multiSizesField').style.display = id ? 'none' : '';

  if(id){
    const item = DATA.find(d=>d.id===id);
    document.getElementById('formTitle').textContent = 'Editar sapato';
    document.getElementById('fCodigo').value = item.codigo || '';
    document.getElementById('fCor').value = item.cor || '';
    document.getElementById('fNum').value = item.numeracao ?? '';
    document.getElementById('fQtd').value = item.quantidade ?? '';
    document.getElementById('fFechamento').checked = item.fechamento || false;
    selectedCat = item.categoria;
    populateWeekSelect(item.semana || '');
    if(item.foto){
      photoDataUrl = item.foto;
      document.getElementById('photoPreview').src = item.foto;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoText').textContent = 'Toque para trocar a foto';

    document.getElementById('fCodigo').value = prefill.codigo || '';
    document.getElementById('fCor').value = prefill.cor || '';
    document.getElementById('fFechamento').checked = prefill.fechamento || false;
    selectedCat = prefill.categoria || 'basquete';
    populateWeekSelect(prefill.semana !== undefined ? prefill.semana : (currentWeek === 'todas' ? '' : currentWeek));
    resetSizeRows();
    if(prefill.foto){
      photoDataUrl = prefill.foto;
      document.getElementById('photoPreview').src = prefill.foto;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoText').textContent = 'Toque para trocar a foto';
    }
  } else {
    document.getElementById('formTitle').textContent = 'Adicionar sapato';
    itemForm.reset();
    selectedCat = null;
    populateWeekSelect(currentWeek === 'todas' ? '' : currentWeek);
    resetSizeRows();
  }
  [...catChoice.children].forEach(b=> b.classList.toggle('sel', b.dataset.cat===selectedCat));
  overlay.classList.add('show');
  openOverlayHistory('overlay');
  if(prefill){ setTimeout(()=> sizeRowsEl.querySelector('.row-num')?.focus(), 150); }
}

const catalogSearch = document.getElementById('catalogSearch');
const catalogResults = document.getElementById('catalogResults');

function hideCatalogResults(){ catalogResults.classList.remove('show'); catalogResults.innerHTML=''; }

function renderCatalogResults(term){
  const t = term.toLowerCase().trim();
  let matches = CATALOG;
  if(t){
    matches = CATALOG.filter(g =>
      (g.codigo||'').toLowerCase().includes(t) ||
      (g.cor||'').toLowerCase().includes(t)
    );
  }
  matches = matches
    .slice()
    .sort((a,b)=> (a.codigo||'').localeCompare(b.codigo||''))
    .slice(0, 12);

  catalogResults.innerHTML = '';
  if(matches.length === 0){
    catalogResults.innerHTML = '<div class="catalog-empty">Nenhum sapato encontrado no catálogo.</div>';
  } else {
    matches.forEach(g=>{
      const div = document.createElement('div');
      div.className = 'catalog-item';
      div.innerHTML = `
        <div class="thumb">${g.foto ? `<img src="${g.foto}" alt="">` : iconFor(g.categoria)}</div>
        <div class="info">
          <div class="cod">${g.codigo||'—'}</div>
          <div class="c">${CAT_LABEL[g.categoria]}${g.cor ? ' · '+g.cor : ''}</div>
        </div>
      `;
      div.addEventListener('click', ()=>{
        selectedCat = g.categoria;
        [...catChoice.children].forEach(b=> b.classList.toggle('sel', b.dataset.cat===selectedCat));
        document.getElementById('fCodigo').value = g.codigo || '';
        document.getElementById('fCor').value = g.cor || '';
        if(g.foto){
          photoDataUrl = g.foto;
          document.getElementById('photoPreview').src = g.foto;
          document.getElementById('photoPreview').style.display = 'block';
          document.getElementById('photoText').textContent = 'Toque para trocar a foto';
        }
        catalogSearch.value = `${g.codigo} — usando cadastro existente`;
        hideCatalogResults();
        sizeRowsEl.querySelector('.row-num')?.focus();
      });
      catalogResults.appendChild(div);
    });
  }
  catalogResults.classList.add('show');
}

catalogSearch.addEventListener('input', ()=> renderCatalogResults(catalogSearch.value));
catalogSearch.addEventListener('focus', ()=> renderCatalogResults(catalogSearch.value));
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.catalog-wrap')) hideCatalogResults();
});

// Redimensiona e comprime a foto no próprio navegador antes de guardar,
// pra evitar que o banco de dados fique pesado e o app trave com o tempo.
function compressImage(file, maxDim = 900, quality = 0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
    reader.onload = (evt) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Não foi possível processar a imagem.'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });
}

});

itemForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  const codigo = document.getElementById('fCodigo').value.trim();
  const cor = document.getElementById('fCor').value.trim();
  const fechamento = document.getElementById('fFechamento').checked;
  const semana = document.getElementById('fSemana').value;

  if(!selectedCat){ toast('Selecione a categoria: Basquete, Bota ou Plataforma.'); return; }
  if(!codigo){ toast('Preencha ao menos o Código.'); return; }
  if(!semana || semana === '__new__'){ toast('Escolha (ou crie) uma semana antes de salvar.'); return; }
  if(!CLOUD_MODE && !db){ toast('Ainda carregando os dados, aguarde um instante e tente de novo.'); return; }

  const basePayload = {
    categoria: selectedCat,
    codigo,
    cor,
    foto: photoDataUrl,
    fechamento,
    semana
  };

  // Lê as linhas de numeração preenchidas, juntando (somando quantidade)
  // caso o mesmo número tenha sido digitado em mais de uma linha.
  function readMergedSizeRows(){
    const merged = new Map();
    [...sizeRowsEl.querySelectorAll('.size-row-input')].forEach(row => {
      const numStr = row.querySelector('.row-num').value.trim();
      const qtdStr = row.querySelector('.row-qtd').value.trim();
      if(numStr === '') return;
      const num = Number(numStr);
      const qtd = qtdStr === '' ? null : Number(qtdStr);
      if(merged.has(num)){
        const prev = merged.get(num);
        merged.set(num, prev === null && qtd === null ? null : (prev||0) + (qtd||0));
      } else {
        merged.set(num, qtd);
      }
    });
    return [...merged.entries()].map(([numeracao, quantidade]) => ({ numeracao, quantidade }));
  }

  try{
    if(editingId){
      const numeracao = document.getElementById('fNum').value.trim();
      const quantidade = document.getElementById('fQtd').value.trim();
      const payload = {
        ...basePayload,
        numeracao: numeracao === '' ? null : Number(numeracao),
        quantidade: quantidade === '' ? null : Number(quantidade)
      };

      const idx = DATA.findIndex(d=>d.id===editingId);
      const oldKey = groupKey(DATA[idx]);
      DATA[idx] = { ...DATA[idx], ...payload };

      // Propaga fechamento/foto/semana pra todas as numerações que estavam
      // no mesmo card (mesmo código, categoria e semana de antes da edição).
      DATA.filter(d => d.id !== editingId && groupKey(d) === oldKey).forEach(item => {
        item.fechamento = payload.fechamento;
        item.foto = payload.foto || item.foto;
        item.semana = payload.semana;
        saveToDB(item);
      });

      upsertCatalogFromItem(payload, codigo);
      toast('Sapato atualizado.');
    } else if(editingGroupKey){
      // Edição do card inteiro: compara a lista nova de numerações com a
      // antiga, atualiza as que continuam, cria as novas e remove as que
      // foram tiradas do formulário.
      const oldRows = DATA.filter(d => groupKey(d) === editingGroupKey);
      const newRows = readMergedSizeRows();

      if(newRows.length === 0){
        toast('Adicione ao menos uma numeração.');
        return;
      }

      const usedOldIds = new Set();
      const finalItems = newRows.map(r => {
        const match = oldRows.find(o => !usedOldIds.has(o.id) && Number(o.numeracao) === r.numeracao);
        if(match){
          usedOldIds.add(match.id);
          return { ...match, ...basePayload, numeracao: r.numeracao, quantidade: r.quantidade };
        }
        return { id: newId(), ...basePayload, numeracao: r.numeracao, quantidade: r.quantidade, jaFechado: false };
      });

      oldRows.filter(o => !usedOldIds.has(o.id)).forEach(o => {
        DATA = DATA.filter(d => d.id !== o.id);
        deleteFromDB(o.id);
      });

      finalItems.forEach(item => {
        const idx = DATA.findIndex(d => d.id === item.id);
        if(idx >= 0) DATA[idx] = item; else DATA.push(item);
        saveToDB(item);
      });

      upsertCatalogFromItem(basePayload, codigo);
      toast('Sapato atualizado.');
    } else {
      // Cadastro novo: cada numeração preenchida vira um item.
      const rows = readMergedSizeRows();

      if(rows.length === 0){
        toast('Adicione ao menos uma numeração.');
        return;
      }

      rows.forEach(r => {
        const newItem = {
          id: newId(),
          ...basePayload,
          numeracao: r.numeracao,
          quantidade: r.quantidade
        };
        DATA.push(newItem);
        saveToDB(newItem);
      });

      if(document.getElementById('fAddToStock').checked){
        upsertCatalogFromItem(basePayload, codigo);
      }
      toast(rows.length === 1 ? 'Sapato adicionado à lista.' : `${rows.length} numerações adicionadas à lista.`);
    }
    closeForm();
    render();
  }catch(err){
    toast('Erro ao salvar: ' + err.message);
  }
});

document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const imported = JSON.parse(evt.target.result);
      if(!Array.isArray(imported)) throw new Error('formato inválido');

      const newData = imported.map(d => ({
        id: newId(),
        categoria: d.categoria || 'basquete',
        codigo: d.codigo || '',
        cor: d.cor || '',
        numeracao: d.numeracao ?? null,
        quantidade: d.quantidade ?? null,
        foto: d.foto || '',
        fechamento: d.fechamento || false,
        jaFechado: d.jaFechado || false,
        semana: d.semana || ''
      }));

      const finishImport = () => {
        DATA = newData;
        const seen = {};
        DATA.forEach(item => {
          const key = catalogKey(item.categoria, item.codigo);
          if(!seen[key]){
            seen[key] = true;
            upsertCatalogFromItem(item, item.codigo);
          }
        });
        render();
        toast('Lista importada com sucesso.');
      };

      if(CLOUD_MODE){
        // Substitui a lista de compras inteira na nuvem (afeta todo mundo que usa este link).
        supa.from('shoes').select('id').then(({data})=>{
          const ids = (data||[]).map(r=>r.id);
          const cleanup = ids.length ? supa.from('shoes').delete().in('id', ids) : Promise.resolve({error:null});
          Promise.resolve(cleanup).then(()=>{
            supa.from('shoes').insert(newData.map(itemToRow)).then(({error})=>{
              if(error){ toast('Erro ao importar na nuvem: ' + error.message); return; }
              finishImport();
            });
          });
        });
      } else {
        const tx = db.transaction('shoes', 'readwrite');
        const store = tx.objectStore('shoes');
        store.clear();
        newData.forEach(item => store.put(item));
        tx.oncomplete = finishImport;
      }
    }catch(err){ toast('Erro ao importar: ' + err.message); }
  };
  reader.readAsText(file);
});

// PWA — registra o Service Worker que guarda os arquivos do app em
// cache, permitindo abrir mais rápido e continuar funcionando mesmo
// sem internet. Se o navegador não suportar (raro hoje em dia), o
// app continua funcionando normalmente, só sem esse recurso.

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
